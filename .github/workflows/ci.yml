name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint (TypeScript)
        run: npm run lint:ts

      - name: ESLint (Vue)
        run: npm run lint:vue

      - name: Stylelint (CSS)
        run: npm run lint:css

      - name: Prettier
        run: npm run format:check

      - name: Markdownlint
        run: npm run lint:md

      - name: Package.json lint
        run: npm run lint:pkg:quiet

  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for emojis
        run: npm run check:emojis

      - name: Check for stale milestone references
        run: npm run check:milestone-refs

      - name: Check for hardcoded rule counts
        run: npm run check:hardcoded-counts

      - name: Check documentation links
        run: npm run check:links

      - name: Check logger spacing
        run: npm run check:logger-spacing

      - name: Check logger usage
        run: npm run check:logger-usage

      - name: Check upstream docs conformance
        run: npm run check:upstream

      # Both workflow guards live in the `check` aggregate, which CI never invokes.
      # Run them explicitly, or they only ever fire on a developer's machine.
      - name: Check upstream-watch workflow cannot clobber issues
        run: npm run check:upstream-workflow

      - name: Check publish workflow for known-broken patterns
        run: npm run check:publish-workflow

      - name: Check GitHub automation security policy
        run: npm run check:github-actions-security

      # The last member of the `check` aggregate that no CI job ran. Adding `manual` to the
      # agent permissionMode enum left the website docs stale and nothing noticed -- the
      # check that exists to catch exactly that had never run on a pull request.
      #
      # Run explicitly rather than via `npm run check`: the aggregate also carries
      # check:publint, which needs a built dist/ and already runs in the Build job.
      - name: Check schema docs coverage
        run: npm run check:schema-docs-coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Check package publishing
        run: npm run check:publint

      - name: Check API type assertions
        run: npm run check:types:api

      - name: Check API code examples compile
        run: npm run check:api-examples

      - name: Check API report is up to date
        run: npm run check:api-report

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/
            presets/
          retention-days: 1

  test:
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [20, 22]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist

      - name: Run tests
        run: npm test -- --coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == 22 && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  rule-verification:
    name: Rule Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify rule implementations
        run: npm run check:rule-implementations

      - name: Verify rule structure
        run: npm run check:rule-structure

      - name: Verify rule since values
        run: npm run check:rule-since

      - name: Verify schema synchronization
        run: npm run check:schema-sync

      - name: Run all validation checks
        run: npm run check:all

  dogfood:
    name: Dogfood
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist

      - name: Run claudelint on itself
        run: node bin/claudelint check-all --format github --strict

  skill-validation:
    name: Skill Validation
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist

      - name: Validate skill structure
        run: npm run test:skills:structure

      - name: Verify CLI commands exist
        run: npm run test:skills:cli

      - name: Check metadata consistency
        run: npm run test:skills:metadata

      - name: Verify plugin archive packages
        run: npm run package:plugin

  integration:
    name: Integration Tests
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist

      - name: Run integration tests
        run: npm test -- --testPathPatterns=integration

  docs-build:
    name: Docs Build
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist

      - name: Build documentation site
        run: npm run docs:build

      - name: Verify llms.txt generated
        run: test -f website/.vitepress/dist/llms.txt && test -f website/.vitepress/dist/llms-full.txt
