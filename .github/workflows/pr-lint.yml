name: PR Lint

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  validate-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          # Type must match [a-zA-Z]+ — no hyphens. The conventional-commits
          # parser rejects hyphenated types regardless of this allowlist, so
          # Dependabot is configured to use `chore(deps)` / `chore(deps-dev)`
          # (hyphen lives in the scope, which is fine).
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            deps
            revert
          requireScope: false
          # dependabot-core appends "[security] "/"[Security] " after the
          # commit prefix (inside the subject) for alert-driven security
          # updates. With version PRs disabled, that is the standard title
          # format of every Dependabot PR here, so this alternative is
          # load-bearing: without it, security PRs fail this required check.
          subjectPattern: ^(\[[Ss]ecurity\] [A-Za-z]|[a-z]).*$
          subjectPatternError: |
            The subject must start with a lowercase letter, or with the
            Dependabot security marker ("[security] " or "[Security] ").
            Example: "feat: add new validation rule"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
