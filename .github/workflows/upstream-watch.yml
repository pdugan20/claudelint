name: Upstream Watch

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: Check upstream docs for drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh docs baseline
        id: refresh
        run: npm run upstream:refresh 2>&1 | tee refresh.log

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- docs-baseline/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- docs-baseline/ > diff.txt
          fi

      - name: Run conformance check
        id: conform
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: npm run check:upstream 2>&1 | tee conform.log

      - name: Open or update drift issue
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Identifies the rolling report as this workflow's own. The lookup below edits
          # an issue ONLY if its body carries this marker. `upstream-drift` is a shared
          # topic label that humans also apply to hand-written backlogs (e.g. #132), so
          # keying the lookup on that label alone made the bot overwrite them -- and
          # `gh issue edit --body` replaces, it does not append.
          MARKER: '<!-- upstream-watch:auto-report -->'
        run: |
          set -euo pipefail

          # Idempotent: the label must exist before `gh issue create --label` can use it.
          gh label create upstream-drift-auto \
            --description "Rolling drift report, owned by the Upstream Watch workflow" \
            --color ededed --force

          # The backticks below are literal Markdown fences, not shell expansion.
          # shellcheck disable=SC2016
          BODY=$(
            printf '%s\n\n' "$MARKER"
            printf '## Upstream docs changed\n\n'
            printf 'The weekly refresh found changes in the Claude Code docs.\n\n'
            printf 'This issue is regenerated by the Upstream Watch workflow on each run.\n'
            printf 'Do not hand-edit the body -- it will be overwritten. Comments are preserved.\n\n'
            printf '### New or removed pages\n\n```text\n'
            grep -E '^\[(NEW|REMOVED) PAGE\]' refresh.log || echo 'None'
            printf '```\n\n### Conformance findings\n\n```text\n'
            cat conform.log
            printf '```\n\n### Baseline diff\n\n```text\n'
            cat diff.txt
            printf '```\n\nTo accept: run `npm run upstream:refresh`, review, and commit.\n'
          )

          # Belt and braces: the issue must carry the bot's own label AND the marker.
          # If a human ever applies the label by hand, the missing marker means we open a
          # fresh issue instead of clobbering theirs. The failure mode is a duplicate
          # issue, never a destroyed one.
          EXISTING=$(
            gh issue list --state open --label upstream-drift-auto --json number,body \
              | jq -r --arg marker "$MARKER" \
                '[.[] | select(.body | contains($marker))] | .[0].number // empty'
          )

          if [ -n "$EXISTING" ]; then
            echo "Updating rolling drift report #$EXISTING"
            gh issue edit "$EXISTING" --body "$BODY"
          else
            echo "Opening a new rolling drift report"
            gh issue create \
              --title 'Upstream drift detected' \
              --label upstream-drift-auto \
              --label upstream-drift \
              --body "$BODY"
          fi
