name: Release

# DO NOT change action `uses:` versions to floating tags (e.g. `@v6`) without
# verifying that the underlying SHA still works for OIDC trusted publishing.
# Combination that's known to publish successfully:
#   - actions/setup-node SHA 53b83947a5a98c8d113130e565377fae1a50d02f (v6.x as of 2026-03-23)
#   - npm install -g npm@latest before publishing (so npm has full OIDC support)
#
# Floating-tag drift in actions/setup-node between 2026-03-23 and 2026-05-03
# silently broke OIDC publishing — provenance signing kept working but the
# registry rejected the upload with a misleading 404. Pinning by SHA prevents
# that recurrence. Update the pin only after confirming a successful publish
# with the new SHA.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm for trusted publishing
        # Pin to a specific npm major. `npm@latest` resolves to versions that
        # currently fail with `Cannot find module 'promise-retry'` mid-bootstrap
        # on Node 22's runner image. Pin to npm@11 which bootstraps cleanly and
        # has full OIDC trusted publishing support for the upload step.
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          # Extract the section for this version (between first and second ## heading)
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, ver)) found=1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
