name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      # Notes:
      # - Do NOT set `registry-url` on setup-node. It writes an .npmrc with
      #   `_authToken=${NODE_AUTH_TOKEN}` and injects a placeholder token
      #   when no NPM_TOKEN secret is set, which causes npm to send the
      #   bogus token instead of falling back to OIDC trusted publishing
      #   (resulting in a misleading 404 from the registry).
      # - Do NOT add `npm install -g npm@latest`. The bundled npm 10.9.7+
      #   already supports OIDC trusted publishing, and the self-upgrade
      #   currently crashes mid-bootstrap with `Cannot find module
      #   'promise-retry'`.

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          # Extract the section for this version (between first and second ## heading)
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, ver)) found=1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
