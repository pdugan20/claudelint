name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Node 24 LTS ships with npm 11+, which has the auto-OIDC-fetch
          # logic needed for trusted publishing. npm 10 (bundled with
          # Node 22) only supports the provenance-signing half of OIDC
          # and silently falls back to "no auth" for the publish itself,
          # producing an ENEEDAUTH error (or a misleading 404 if a
          # placeholder NODE_AUTH_TOKEN is in scope).
          node-version: '24'
          cache: 'npm'

      # Do NOT set `registry-url` on setup-node — it injects a placeholder
      # NODE_AUTH_TOKEN that npm uses instead of falling back to OIDC.
      # Do NOT run `npm install -g npm@latest` — the self-upgrade crashes
      # the runner with `Cannot find module 'promise-retry'`. Node 24's
      # bundled npm is already the version we need.

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          # Extract the section for this version (between first and second ## heading)
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, ver)) found=1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md

      # Bundle .claude-plugin/ + skills/ into claudelint-plugin.zip and
      # attach it to the release so users can trial the plugin via
      # `claude --plugin-url` without registering the marketplace.
      - name: Package plugin archive
        run: npm run package:plugin

      - name: Create GitHub Release
        run: |
          # A pre-release tag (e.g. v1.2.3-beta.0) must be flagged so it
          # does not become "latest" — the plugin trial docs point users
          # at /releases/latest/download/claudelint-plugin.zip.
          PRERELEASE=
          case "${{ github.ref_name }}" in *-*) PRERELEASE=--prerelease ;; esac
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file release-notes.md $PRERELEASE claudelint-plugin.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
