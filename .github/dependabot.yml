version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    commit-message:
      # Type must be a single word (no hyphens) for the
      # conventional-commits parser used by PR Lint.
      # `include: "scope"` adds `(deps)` / `(deps-dev)` automatically,
      # so we still distinguish prod vs dev in the scope.
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    assignees:
      - "pdugan20"
    reviewers:
      - "pdugan20"
    # Skip major-version bumps — they're rarely a no-op merge and tend to
    # break ts-node / CI in ways that need a human. Upgrade majors manually.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Group minor and patch updates to reduce PR noise
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    assignees:
      - "pdugan20"
    reviewers:
      - "pdugan20"
    # Group all Actions updates into a single PR
    groups:
      github-actions:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
