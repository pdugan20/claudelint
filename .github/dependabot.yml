version: 2
# Renovate owns routine version updates (renovate.json). Dependabot stays
# registered for security updates only: open-pull-requests-limit: 0 turns off
# version PRs while security PRs keep the commit prefixes and labels below.
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 0
    commit-message:
      # Type must be a single word (no hyphens) for the
      # conventional-commits parser used by PR Lint.
      # `include: "scope"` adds `(deps)` / `(deps-dev)` automatically,
      # so we still distinguish prod vs dev in the scope.
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    assignees:
      - "pdugan20"
    reviewers:
      - "pdugan20"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    assignees:
      - "pdugan20"
    reviewers:
      - "pdugan20"
